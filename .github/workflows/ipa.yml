name: ipa

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      # No signing identity on the runner: the IPA comes out unsigned and is
      # signed on the Mac or on the device when it is sideloaded.
      - name: Build
        run: |
          xcodebuild \
            -project MangaToolsReader.xcodeproj \
            -scheme MangaToolsReader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package the IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/MangaToolsReader.app" Payload/
          zip -qry mangaToolsReader-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: mangaToolsReader-unsigned-ipa
          path: mangaToolsReader-unsigned.ipa
          if-no-files-found: error

      - name: Attach the IPA to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mangaToolsReader-unsigned.ipa
