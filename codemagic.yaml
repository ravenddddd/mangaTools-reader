workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true
      tag_patterns:
        - pattern: "v*"
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate the Xcode project
        script: xcodegen generate

      # No signing identity here either: the IPA is signed when it is
      # sideloaded, exactly like the one GitHub Actions produces.
      - name: Build
        script: |
          xcodebuild \
            -project MangaToolsReader.xcodeproj \
            -scheme MangaToolsReader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package the IPA
        script: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/MangaToolsReader.app" Payload/
          zip -qry mangaToolsReader-unsigned.ipa Payload

    artifacts:
      - mangaToolsReader-unsigned.ipa
